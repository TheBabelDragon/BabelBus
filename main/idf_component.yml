## IDF Component Manager manifest
##
## Wi-Fi on Waveshare ESP32-P4-WIFI6 requires the C6 co-processor path.
## Uncomment the two lines below, then:
##   idf.py add-dependency "espressif/esp_wifi_remote"
##   idf.py add-dependency "espressif/esp_hosted"
## and enable BABELBUS_WIFI_ENABLE in menuconfig.
dependencies:
  espressif/mdns:
    version: "^1.8.0"
  # espressif/esp_wifi_remote:
  #   version: "*"
  # espressif/esp_hosted:
  #   version: "*"
