<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <title>BabelBus</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #1a1a1f; color: #e8f0ff; }
      header {
        display: flex; justify-content: space-between; align-items: center; gap: 1rem;
        padding: 0.65rem 1rem; border-bottom: 1px solid #ffffff1f;
      }
      h1 { margin: 0; font-size: 1.25rem; font-weight: 600; color: #c8d4ee; }
      .right { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
      #st { margin: 0; font-size: 0.9rem; color: #c8d4ee; }
      details { position: relative; }
      summary {
        list-style: none; cursor: pointer; padding: 0.35rem 0.5rem;
        border-radius: 6px; color: #c8d4ee;
      }
      summary::-webkit-details-marker { display: none; }
      summary:hover { background: #ffffff14; }
      .panel {
        position: absolute; right: 0; top: calc(100% + 0.35rem); z-index: 20;
        min-width: 16rem; background: #252530; border: 1px solid #ffffff26;
        border-radius: 8px; padding: 1rem 0.85rem; display: flex; flex-direction: column;
        gap: 0.75rem; box-shadow: 0 6px 20px #00000073;
      }
      .panel label { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.85rem; color: #b8c4dc; }
      .panel .row { display: flex; gap: 0.5rem; align-items: center; }
      input[type="number"] { width: 3.5rem; font: inherit; padding: 0.25rem 0.35rem; }
      input[type="range"] { width: 100%; }
      button {
        font: inherit; cursor: pointer; color: #e8edf8; background: #353542;
        border: 1px solid #ffffff24; border-radius: 6px; padding: 0.4rem 0.75rem;
      }
      button:hover { background: #3f3f4e; }
      .wrap { width: 100%; background: #000; }
      #view {
        width: 100%; max-width: 100%; height: auto; display: block;
        background: #111; image-rendering: auto;
      }
      .note { color: #888; font-size: 0.85rem; padding: 0.75rem 1rem; }
      #audio-st { color: #8bd88b; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>BabelBus</h1>
      <div class="right">
        <p id="st">Connecting…</p>
        <span id="audio-st"></span>
        <details>
          <summary title="Settings">⚙</summary>
          <div class="panel">
            <label>
              Encoding quality (1–100)
              <span class="row">
                <input type="number" id="jpeg-q" min="1" max="100" step="1" value="40" />
                <button type="button" id="btn-jpeg-q">Apply</button>
              </span>
            </label>
            <label>
              Volume
              <input type="range" id="vol" min="0" max="100" value="80" />
            </label>
            <label class="row">
              <input type="checkbox" id="enable-audio" checked />
              Enable audio
            </label>
            <button type="button" id="btn-audio">Start audio</button>
            <button type="button" id="btn-reload">Reload stream</button>
          </div>
        </details>
      </div>
    </header>
    <div class="wrap">
      <img id="view" alt="BabelBus stream" />
    </div>
    <p class="note">Native Motion-JPEG · click video for audio · quality in ⚙</p>
    <script>
      (function () {
        const img = document.getElementById("view");
        const st = document.getElementById("st");
        const audioSt = document.getElementById("audio-st");
        const jpegQ = document.getElementById("jpeg-q");
        const btnQ = document.getElementById("btn-jpeg-q");
        const volEl = document.getElementById("vol");
        const enableAudio = document.getElementById("enable-audio");
        const btnAudio = document.getElementById("btn-audio");
        const btnReload = document.getElementById("btn-reload");

        let audioCtx = null, gainNode = null, audioAbort = null;
        let nextAudioTime = 0;
        let audioStarted = false;
        let reconnectTimer = null;
        let backoffMs = 500;
        let connecting = false;

        function reloadStream() {
          if (connecting) return;
          connecting = true;
          st.textContent = "Connecting…";
          /* Bust cache; force new /stream socket */
          img.src = "/stream?t=" + Date.now();
          /* Clear connecting flag after browser has had time to attach */
          setTimeout(function () { connecting = false; }, 300);
        }

        function scheduleReconnect() {
          if (reconnectTimer) return;
          st.textContent = "Reconnecting…";
          const wait = backoffMs;
          backoffMs = Math.min(backoffMs * 1.5, 4000);
          reconnectTimer = setTimeout(function () {
            reconnectTimer = null;
            reloadStream();
          }, wait);
        }

        img.addEventListener("error", function () {
          scheduleReconnect();
        });
        img.addEventListener("load", function () {
          st.textContent = "Live";
          backoffMs = 500;
          if (reconnectTimer) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
          }
        });

        async function syncQ() {
          try {
            const r = await fetch("/jpeg-quality", { cache: "no-store" });
            if (!r.ok) return;
            const n = parseInt((await r.text()).trim(), 10);
            if (n >= 1 && n <= 100) jpegQ.value = String(n);
          } catch (_) {}
        }

        async function applyQ() {
          let q = parseInt(jpegQ.value, 10);
          if (isNaN(q)) return;
          q = Math.max(1, Math.min(100, q));
          jpegQ.value = String(q);
          try {
            const r = await fetch("/jpeg-quality?q=" + q, { cache: "no-store" });
            if (r.ok) {
              const n = parseInt((await r.text()).trim(), 10);
              if (n >= 1 && n <= 100) jpegQ.value = String(n);
            }
          } catch (_) {}
        }

        function stopAudio() {
          if (audioAbort) { try { audioAbort.abort(); } catch (_) {} audioAbort = null; }
          if (audioCtx) { try { audioCtx.close(); } catch (_) {} audioCtx = null; gainNode = null; }
          nextAudioTime = 0;
          audioStarted = false;
          audioSt.textContent = "";
        }

        async function startAudio() {
          if (!enableAudio.checked) return;
          stopAudio();
          audioAbort = new AbortController();
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
            if (audioCtx.state === "suspended") await audioCtx.resume();
            gainNode = audioCtx.createGain();
            gainNode.gain.value = (parseInt(volEl.value, 10) || 80) / 100;
            gainNode.connect(audioCtx.destination);
            nextAudioTime = audioCtx.currentTime + 0.05;
            const res = await fetch("/audio", { signal: audioAbort.signal, cache: "no-store" });
            if (!res.ok || !res.body) {
              audioSt.textContent = "Audio N/A";
              stopAudio();
              return;
            }
            audioStarted = true;
            audioSt.textContent = "🔊";
            const reader = res.body.getReader();
            let leftover = new Uint8Array(0);
            for (;;) {
              const { done, value } = await reader.read();
              if (done || audioAbort.signal.aborted) break;
              if (!value || !value.length) continue;
              const t = new Uint8Array(leftover.length + value.length);
              t.set(leftover); t.set(value, leftover.length);
              const frames = Math.floor(t.length / 4);
              leftover = t.slice(frames * 4);
              if (frames < 64) continue;
              const buf = audioCtx.createBuffer(2, frames, 48000);
              const L = buf.getChannelData(0), R = buf.getChannelData(1);
              const dv = new DataView(t.buffer, t.byteOffset, frames * 4);
              for (let i = 0; i < frames; i++) {
                L[i] = dv.getInt16(i * 4, true) / 32768;
                R[i] = dv.getInt16(i * 4 + 2, true) / 32768;
              }
              const src = audioCtx.createBufferSource();
              src.buffer = buf;
              src.connect(gainNode);
              const startAt = Math.max(nextAudioTime, audioCtx.currentTime + 0.02);
              src.start(startAt);
              nextAudioTime = startAt + frames / 48000;
              if (nextAudioTime < audioCtx.currentTime - 0.2) nextAudioTime = audioCtx.currentTime + 0.05;
            }
          } catch (_) {}
          if (audioStarted && enableAudio.checked && audioAbort && !audioAbort.signal.aborted) {
            setTimeout(function () { if (enableAudio.checked) startAudio(); }, 500);
          }
        }

        function unlockAudio() {
          if (!enableAudio.checked) return;
          if (audioStarted && audioCtx && audioCtx.state === "running") return;
          startAudio();
        }

        btnQ.addEventListener("click", applyQ);
        jpegQ.addEventListener("keydown", function (e) { if (e.key === "Enter") applyQ(); });
        volEl.addEventListener("input", function () {
          if (gainNode) gainNode.gain.value = (parseInt(volEl.value, 10) || 0) / 100;
        });
        enableAudio.addEventListener("change", function () {
          if (enableAudio.checked) unlockAudio(); else stopAudio();
        });
        btnAudio.addEventListener("click", unlockAudio);
        btnReload.addEventListener("click", function () {
          backoffMs = 500;
          if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
          reloadStream();
        });
        img.addEventListener("click", unlockAudio);
        document.body.addEventListener("pointerdown", unlockAudio, { once: true });
        window.addEventListener("pagehide", stopAudio);

        syncQ();
        /* Start stream after layout — avoids racing DOM with /stream. */
        setTimeout(reloadStream, 50);
      })();
    </script>
  </body>
</html>
